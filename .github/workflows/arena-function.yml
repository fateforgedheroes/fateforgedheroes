# Deploys the `arena` Supabase Edge Function whenever the engine or the function changes on main.
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project id, the part before .supabase.co in the project URL
name: Deploy arena function
on:
  push:
    branches: [main]
    paths: ['engine.js', 'src/engine.js', 'supabase/functions/**', '.github/workflows/arena-function.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # the server runs the game's own engine: engine.js + an ES module export
      - name: Bundle the engine
        run: |
          src=engine.js; [ -f src/engine.js ] && src=src/engine.js
          { cat "$src"; echo; echo 'export default K;'; } > supabase/functions/arena/engine.mjs
      - name: Deploy
        run: supabase functions deploy arena --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
