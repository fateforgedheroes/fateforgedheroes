<title>Fate Forged Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one column, max 1120px — a dark ash-stone frame around a pixel battlefield; gold = crowns/selection, ember = damage */
:root {
  --bg: #110e13;
  --panel: #1b1620;
  --panel-2: #241d2a;
  --line: #3a3042;
  --fg: #ece2cf;
  --muted: #a69ca8;
  --gold: #d9b45a;
  --gold-dim: #8a7236;
  --ember: #e8743b;
  --good: #7cc35a;
  --bad: #d9533f;
  --info: #7fb2e8;
  --violet: #b08aff;
  --r0: #9a948c; --r1: #6fbf5a; --r2: #5a9ae8; --r3: #b07ae8; --r4: #e8b83b; --r5: #ff4a4a;
  --font-display: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
  --font-body: "Crimson Pro", Georgia, "Times New Roman", serif;
  --font-tag: "Cinzel", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); color: var(--fg); }
body { color: var(--fg); }
/* the painted page background (bg.js PAGE_BG, set as --page-bg by app.js) stays put behind every screen: clear on Home,
   darkened elsewhere so text-heavy screens stay readable */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(rgba(12, 9, 16, var(--bg-dim)), rgba(12, 9, 16, var(--bg-dim))), var(--page-bg, none) center 40% / cover no-repeat, var(--bg); }
:root { --bg-dim: .72; }
body[data-tab="home"] { --bg-dim: .3; }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.45; font-variant-numeric: lining-nums; }
button { font: inherit; color: inherit; }
img.spr, .spr { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.05rem; color: var(--gold); margin-bottom: 8px; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.tag { font-family: var(--font-tag); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 12px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 30px; }
.brand h1 { font-size: 1.7rem; color: var(--fg); line-height: 1; }
.brand h1 span { color: var(--gold); }
.wallet { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.res { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid var(--line); padding: 3px 10px; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-size: 1.05rem; }
.res small { color: var(--muted); }
.iconbtn { background: var(--panel); border: 2px solid var(--line); padding: 3px 10px; cursor: pointer; color: var(--muted); }
.iconbtn.on { color: var(--gold); border-color: var(--gold-dim); }
.tabs { display: flex; gap: 4px; margin-block: 14px 18px; flex-wrap: wrap; }
.tabs button { position: relative; background: transparent; border: 2px solid transparent; padding: 6px 14px; cursor: pointer; color: var(--muted); font-size: 1.05rem; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.tabs .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: var(--ember); }

.btn { background: var(--panel-2); border: 2px solid var(--line); padding: 7px 14px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.btn:hover:not(:disabled) { border-color: var(--gold-dim); }
.btn.primary { background: var(--gold); color: #1a130a; border-color: var(--gold); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #e8c56c; }
.btn.violet { background: #5a3a9a; border-color: var(--violet); color: #f4ecff; font-weight: 600; }
.btn.violet:hover:not(:disabled) { background: #6a48b0; }
.btn.danger { border-color: #6a2e2a; color: #f0b0a0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: .9rem; }
.btn img { width: 16px; height: 16px; vertical-align: -3px; }

.aff { display: inline-grid; place-items: center; width: 18px; height: 18px; background: var(--c); color: #140f12; font-family: var(--font-tag); font-size: 10px; font-weight: 700; flex: none; }
.rar-0 { --rc: var(--r0); } .rar-1 { --rc: var(--r1); } .rar-2 { --rc: var(--r2); } .rar-3 { --rc: var(--r3); } .rar-4 { --rc: var(--r4); } .rar-5 { --rc: var(--r5); }
.rartxt { color: var(--rc); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: .9rem; white-space: nowrap; }
.stars i { color: #4a4050; font-style: normal; }

/* campaign */
.camp-head { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
.camp-head h2 { margin: 0; }
.teamstrip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mini { width: 66px; background: var(--panel); border: 2px solid var(--line); border-bottom-color: var(--rc); text-align: center; }
.mini img { display: block; margin: 0 auto; width: 62px; height: 62px; }
.bh-row.locked img { filter: brightness(.25) grayscale(1); }
.mini span { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-bottom: 2px; }
.power { background: var(--panel); border: 2px solid var(--gold-dim); padding: 4px 10px; text-align: center; }
.power b { display: block; font-size: 1.2rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 2px solid var(--line); }
.seg button { background: var(--panel); border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a130a; }
.seg button:disabled { cursor: not-allowed; opacity: .5; }
.area-label { margin: 20px 0 8px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.area-label::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
.stage { text-align: left; background: var(--panel); border: 2px solid var(--line); padding: 10px 12px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); }
.stage:hover:not(:disabled) { border-color: var(--gold-dim); transform: translateY(-1px); }
.stage.next { border-color: var(--gold); background: linear-gradient(var(--panel-2), var(--panel)); }
.stage.locked { opacity: .45; cursor: not-allowed; }
.hardmode .stage.next { border-color: var(--bad); }
.st-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.st-n { font-size: 1.2rem; font-weight: 700; white-space: nowrap; }
.st-state { color: var(--muted); }
.stage.next .st-state { color: var(--gold); }
.stage.cleared .st-state { color: var(--good); }
.st-foes { display: flex; align-items: center; gap: 4px; min-height: 50px; flex-wrap: wrap; }
.st-foes img { width: 44px; height: 44px; flex: none; border: 2px solid #3a2226; background: #1a1214; }
.st-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; }
.st-ess { display: inline-flex; gap: 2px; margin-right: 2px; }
.pill { display: inline-block; padding: 1px 7px; border: 1px solid var(--line); background: rgba(0,0,0,.25); border-radius: 999px; line-height: 1.5; white-space: nowrap; }
.st-boss { color: var(--ember); font-weight: 600; font-size: .88rem; }

.st-reward { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--gold); border-top: 2px dashed var(--line); padding-top: 6px; flex-wrap: wrap; }
.st-reward .rw { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.st-reward img.spr { width: 33px; height: 33px; }
.st-reward img.ic { width: 16px; height: 16px; }
.help { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.help > div { background: var(--panel); border: 2px solid var(--line); padding: 12px 14px; min-width: 0; }
.help p { margin: 0; color: var(--muted); font-size: .95rem; }
.tri { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

/* dungeons */
.dungeons { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.dg { background: var(--panel); border: 2px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.dg.locked { opacity: .55; }
.dg-art { position: relative; height: 150px; overflow: hidden; border-bottom: 2px solid var(--line); background: #000; }
.dg-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.dg-art img { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); }
.dg-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.dg-body p { margin: 0; color: var(--muted); font-size: .95rem; }
.setlist { display: flex; flex-direction: column; gap: 3px; font-size: .9rem; }
.setlist b { color: var(--fg); }
.setlist span { color: var(--muted); }
.lvls { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.lvls button { padding: 5px 0; background: var(--panel-2); border: 2px solid var(--line); cursor: pointer; font-variant-numeric: tabular-nums; }
.lvls button.done { color: var(--good); }
.lvls button.sel { border-color: var(--gold); color: var(--gold); }
.lvls button:disabled { opacity: .35; cursor: not-allowed; }

/* altar */
.altar { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
.altar-stage { position: relative; background: radial-gradient(ellipse at 50% 70%, #3a2466 0%, #1a1224 55%, var(--panel) 100%); border: 2px solid #4a3a6a; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 18px; gap: 14px; overflow: hidden; }
.altar-stage canvas { image-rendering: pixelated; width: 192px; height: 192px; }
.altar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.rates { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rates td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.rates td:last-child { text-align: right; }
.pity { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.altar-stage .pity { width: 100%; max-width: 320px; margin-top: 0; gap: 4px; text-align: center; }
.bar.leg i { background: linear-gradient(90deg, #b8862e, var(--gold)); } .pity .pity-leg { color: var(--gold); margin-top: 4px; }
.bar { height: 8px; background: var(--bg); border: 2px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--violet); }
.summon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.sum-card { background: var(--panel-2); border: 2px solid var(--rc); padding: 8px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; animation: flipin .45s ease-out forwards; box-shadow: 0 0 0 2px #000, 0 0 16px -4px var(--rc); }
.sum-card .nm { font-weight: 600; font-size: .9rem; }
.sum-card img.spr { width: 72px; height: 72px; }
.sum-card small { color: var(--muted); font-size: .75rem; }
.sum-card .new { font-family: var(--font-tag); font-size: 9px; background: var(--gold); color: #1a130a; padding: 1px 4px; }
@keyframes flipin { 0% { opacity: 0; transform: rotateY(90deg) scale(.8); } 60% { opacity: 1; transform: rotateY(-10deg) scale(1.05); } 100% { opacity: 1; transform: none; } }
/* the summon reveal (app.js summonReveal): the shard charges in the colour of the rarity it has reached so far (blue,
   then violet for an Epic, then gold for a Legendary), shakes harder each step, bursts and shows the hero */
.sfx { --rc: var(--r2); position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--rc) 24%, #0b0714) 0%, #06040b 68%); animation: sfx-fade .3s ease-out; }
.sfx.lv3 { --rc: var(--r3); } .sfx.lv4 { --rc: var(--r4); }
.sfx > * { grid-area: 1 / 1; }
.sfx-circle { width: min(64vmin, 400px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--rc); box-shadow: 0 0 26px var(--rc), inset 0 0 36px color-mix(in srgb, var(--rc) 45%, transparent);
  position: relative; animation: sfx-spin 7s linear infinite; transition: opacity .4s, transform .5s; }
.sfx-circle::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 2px dotted color-mix(in srgb, var(--rc) 80%, #fff); animation: sfx-spin 4s linear infinite reverse; }
.sfx-circle::after { content: ""; position: absolute; inset: 20%; border-radius: 50%; background: repeating-conic-gradient(color-mix(in srgb, var(--rc) 70%, #fff) 0 2deg, transparent 2deg 12deg);
  -webkit-mask: radial-gradient(closest-side, transparent 80%, #000 82%); mask: radial-gradient(closest-side, transparent 80%, #000 82%); opacity: .8; }
.sfx-glow { width: min(54vmin, 320px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--rc) 85%, #fff), transparent); opacity: .5;
  animation: sfx-pulse .5s ease-in-out infinite alternate; transition: transform .45s, opacity .4s; }
.sfx.lv3 .sfx-glow { transform: scale(1.25); } .sfx.lv4 .sfx-glow { transform: scale(1.55); }
.sfx-shard { width: min(28vmin, 160px); --amp: 1px; filter: drop-shadow(0 0 10px var(--rc)) drop-shadow(0 0 26px var(--rc)); animation: sfx-float 1.4s ease-in-out infinite alternate, sfx-shake .09s linear infinite;
  transition: scale .45s cubic-bezier(.3, 1.6, .5, 1), opacity .3s; }
.sfx.lv3 .sfx-shard { --amp: 2.5px; scale: 1.14; } .sfx.lv4 .sfx-shard { --amp: 4.5px; scale: 1.3; }
.sfx-motes, .sfx-sparks { position: absolute; inset: 0; pointer-events: none; }
.sfx-motes i, .sfx-sparks i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: color-mix(in srgb, var(--rc) 60%, #fff); box-shadow: 0 0 8px var(--rc), 0 0 2px #fff; }
.sfx-motes i { animation: sfx-in 1.2s linear infinite; }
.sfx.lv4 .sfx-motes i { animation-duration: .8s; }
.sfx-sparks i { opacity: 0; }
.sfx.burst .sfx-sparks i { animation: sfx-out 1s cubic-bezier(.15, .8, .3, 1) forwards; }
.sfx-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, #fff 0%, color-mix(in srgb, var(--rc) 70%, #fff) 30%, transparent 75%); }
.sfx-flash.go { animation: sfx-flash .55s ease-out; }
.sfx.burst .sfx-flash.go { animation-duration: .9s; background: radial-gradient(circle, #fff 0%, #fff 35%, color-mix(in srgb, var(--rc) 60%, #fff) 60%, transparent 100%); }
.sfx.burst .sfx-shard { scale: 2.4; opacity: 0; }
.sfx.burst .sfx-motes, .sfx.reveal .sfx-motes, .sfx.reveal .sfx-shard, .sfx.reveal .sfx-glow { opacity: 0; transition: opacity .2s; }
.sfx.reveal .sfx-circle { opacity: .22; transform: scale(1.5); }
.sfx-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 4vw, 48px); padding: 12px 20px 44px; pointer-events: none; }
.sfx-hw { position: relative; height: min(80dvh, 560px); aspect-ratio: 1; display: grid; place-items: end center; flex: none; }
.sfx-rays { position: absolute; left: 50%; top: 50%; width: 170vmax; aspect-ratio: 1; translate: -50% -50%; pointer-events: none; z-index: -1;
  background: repeating-conic-gradient(color-mix(in srgb, var(--rc) 38%, transparent) 0 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(closest-side, #000 4%, transparent 40%); mask: radial-gradient(closest-side, #000 4%, transparent 40%); animation: sfx-spin 24s linear infinite, sfx-fade .6s ease-out; }
.sfx.lv4 .sfx-rays { background: repeating-conic-gradient(color-mix(in srgb, var(--rc) 55%, transparent) 0 4deg, transparent 4deg 11deg); }
.sfx-hero { --hs: drop-shadow(0 0 14px color-mix(in srgb, var(--rc) 80%, transparent)) drop-shadow(0 6px 4px rgba(0,0,0,.6)); width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; filter: brightness(1) blur(0) var(--hs);
  animation: sfx-hero .8s cubic-bezier(.2, 1.25, .4, 1) both; }
.sfx-info { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: min(46vw, 380px); animation: sfx-info .6s .3s ease-out both; }
.sfx-rar { font-family: var(--font-tag); font-weight: 900; font-size: .85rem; letter-spacing: .28em; text-transform: uppercase; color: #120c18; padding: 3px 12px 3px 14px;
  background: linear-gradient(90deg, var(--rc), color-mix(in srgb, var(--rc) 55%, #fff), var(--rc)); box-shadow: 0 0 18px var(--rc); }
.sfx.lv4 .sfx-rar { background-size: 200% 100%; animation: sfx-shine 1.6s linear infinite; }
.sfx-info h2 { font-size: clamp(1.6rem, 4.2vw + .6rem, 3rem); line-height: 1.05; color: #fff; text-shadow: 0 0 18px var(--rc), 0 2px 0 rgba(0,0,0,.6); }
.sfx-info .stars { font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 10px rgba(232,184,59,.7); letter-spacing: .1em; }
.sfx-id { display: flex; align-items: center; gap: 8px; color: #e8e0f2; font-size: 1.05rem; }
.sfx-new { font-family: var(--font-tag); font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; background: var(--gold); color: #1a130a; padding: 2px 10px; animation: sfx-pulse .7s ease-in-out infinite alternate; }
.sfx-dup { color: #b8afc6; font-size: .9rem; }
.sfx-tap { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); text-align: center; font-family: var(--font-tag); font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: #cfc6dc;
  animation: sfx-blink 1.6s ease-in-out infinite, sfx-fade .4s .9s both; }
.sfx-skip { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); justify-self: end; align-self: start; z-index: 2;
  font-family: var(--font-tag); font-size: .8rem; letter-spacing: .1em; color: #ddd4ea; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.sfx-skip:hover { border-color: var(--rc); color: #fff; }
@media (orientation: portrait) {
  .sfx-stage { flex-direction: column; gap: 10px; }
  .sfx-hw { height: min(54dvh, 480px); }
  .sfx-info { align-items: center; text-align: center; max-width: 92vw; }
}
@keyframes sfx-fade { from { opacity: 0; } }
@keyframes sfx-spin { to { rotate: 360deg; } }
@keyframes sfx-pulse { from { opacity: .35; } to { opacity: .75; } }
@keyframes sfx-float { from { transform: translateY(6px); } to { transform: translateY(-8px); } }
@keyframes sfx-shake { 0% { translate: 0 0; } 25% { translate: var(--amp) calc(var(--amp) * -.5); } 50% { translate: calc(var(--amp) * -1) calc(var(--amp) * .5); } 75% { translate: calc(var(--amp) * .5) var(--amp); } }
@keyframes sfx-in { 0% { transform: translate(var(--dx), var(--dy)) scale(.9); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(0, 0) scale(.2); opacity: 0; } }
@keyframes sfx-out { 0% { transform: translate(0, 0) scale(1.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(var(--s)); opacity: 0; } }
@keyframes sfx-flash { 0% { opacity: .95; } 100% { opacity: 0; } }
@keyframes sfx-hero { 0% { opacity: 0; transform: scale(.55) translateY(8%); filter: brightness(5) blur(3px) var(--hs); } 60% { opacity: 1; filter: brightness(1.6) blur(0) var(--hs); } 100% { opacity: 1; transform: none; filter: brightness(1) blur(0) var(--hs); } }
@keyframes sfx-info { from { opacity: 0; transform: translateX(24px); } }
@keyframes sfx-shine { from { background-position: 200% 0; } to { background-position: 0 0; } }
@keyframes sfx-blink { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .sfx-circle, .sfx-circle::before, .sfx-rays, .sfx-shard, .sfx-motes i { animation: none; } }

/* roster cards */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.card { position: relative; background: var(--panel); border: 2px solid var(--line); border-bottom: 4px solid var(--rc); padding: 6px 6px 8px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.card:hover { border-color: var(--gold-dim); border-bottom-color: var(--rc); }
.card .nm { font-weight: 600; font-size: .98rem; }
.card .sub { font-size: .8rem; color: var(--muted); }
.card .aff { position: absolute; top: 6px; left: 6px; }
/* hero level: a small gold square in the top-right corner */
.card .lv, .slot .lv { position: absolute; top: 4px; right: 4px; z-index: 1; min-width: 20px; height: 20px; padding: 0 3px; display: grid; place-items: center; background: var(--gold); color: #140f0a; font-family: var(--font-display); font-weight: 900; font-size: 11px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; box-shadow: 0 0 0 1px #000, inset 0 -2px 0 rgba(0,0,0,.25); }
.slot.filled { position: relative; }
.card.sel { border-color: var(--gold); border-bottom-color: var(--rc); background: var(--panel-2); }
.card.inteam { padding-bottom: 20px; }
.card.inteam::after { content: "In team"; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1a130a; font-family: var(--font-tag); font-size: 9px; padding: 1px 5px; }
.card.lockedc { cursor: default; opacity: .5; }
.card.lockedc img { filter: brightness(0) opacity(.5); }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; max-width: 620px; }
.slot { background: var(--panel); border: 2px dashed var(--line); min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 6px; min-width: 0; }
.slot.filled { border-style: solid; border-bottom: 4px solid var(--rc); }
.slot img { max-width: 100%; }
.slot small { color: var(--muted); text-align: center; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

/* champions */
.champ-layout { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.champ-layout .grid-cards { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.detail { background: var(--panel); border: 2px solid var(--line); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.d-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.d-head .bigspr { max-height: 170px; background: radial-gradient(circle at 50% 70%, var(--panel-2), transparent 70%); flex: none; }
.d-head .bigspr.dev-art { border: 2px solid var(--gold); box-shadow: 0 0 0 2px #000, 0 0 16px -4px var(--gold); image-rendering: auto; }
.d-head > div { min-width: 0; flex: 1; }
.tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); margin: 4px 0 6px; }
.xpbar { height: 8px; background: var(--bg); border: 2px solid var(--line); margin: 4px 0 2px; max-width: 320px; }
.xpbar i { display: block; height: 100%; background: var(--info); }
.rank { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.d-cols { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px; }
dl.stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; font-variant-numeric: tabular-nums; }
dl.stats dt { color: var(--muted); }
dl.stats dd { margin: 0; text-align: right; }
dl.stats dd small { color: var(--good); margin-left: 4px; }
.skill { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.skill b { font-weight: 600; }
.skill .cd { color: var(--muted); font-size: .85rem; margin-left: 6px; }
.skill p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.skill.passive { border-left-color: var(--gold-dim); }
.pips { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: 1px; }
.pips i { width: 7px; height: 7px; background: #3a3042; }
.pips i.on { background: var(--violet); }
.gear-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.gslot { border: 2px solid var(--line); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gslot.empty { border-style: dashed; }
.gslot .row, .inv-item .row { display: flex; gap: 6px; flex-wrap: wrap; }
.item-name { font-weight: 600; color: var(--rc); }
.item-set { font-size: .82rem; color: var(--gold); }
.item-stats { list-style: none; margin: 0; padding: 0; font-size: .92rem; font-variant-numeric: tabular-nums; }
.item-stats li.main { color: var(--fg); }
.item-stats li { color: var(--muted); }
.setbonus { display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.setbonus .on { color: var(--good); }
.setbonus .off { color: var(--muted); }
/* campaign difficulty */
.seg.diffs { flex-wrap: wrap; }
.seg.diffs button { display: inline-flex; align-items: center; gap: 4px; }
.lock-ic { width: 12px; height: 12px; flex: none; }
.diff-note { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
.diff-note b, .st-drop b.rartxt { font-weight: 600; }
.diff-normal .stage.next { border-color: var(--r2); }
.diff-hard .stage.next { border-color: var(--r3); }
.diff-brutal .stage.next { border-color: var(--r4); }
.diff-nightmare .stage.next { border-color: var(--r5); }
/* gear tiles (hero Gear tab) */
.gear-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.gtile { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.gt-main { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; background: var(--panel-2); border: 2px solid var(--rc, var(--line)); box-shadow: inset 0 0 18px -8px var(--rc, transparent); color: var(--fg); cursor: pointer; min-width: 0; font: inherit; }
.gt-main:hover { filter: brightness(1.15); }
.gt-main:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gtile.empty .gt-main { border-style: dashed; border-color: var(--line); color: var(--muted); box-shadow: none; }
.gt-slot { font-family: var(--font-tag); font-size: 9px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.gt-ic { position: relative; width: 34px; height: 34px; color: var(--rc, var(--muted)); display: grid; place-items: center; }
.gt-ic svg { width: 30px; height: 30px; }
.gt-lv { position: absolute; right: -10px; bottom: -4px; font-style: normal; font-family: var(--font-tag); font-size: 10px; background: var(--gold); color: #1a130a; padding: 1px 3px; line-height: 1.1; }
/* gear art (gear.js) */
.gear-ic { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.gt-ic { width: 58px; height: 58px; }
.gt-ic .gear-ic { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--rc) 55%, transparent)) drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.gt-ic.big { width: 72px; height: 72px; flex: none; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 22%, transparent), transparent 70%); }
.st-dic { overflow: hidden; }
.st-dic .gear-ic { width: 26px; height: 26px; }
.inv-head { display: flex; align-items: center; gap: 8px; }
.inv-head > .gear-ic { width: 40px; height: 40px; flex: none; }
.inv-head > div { display: flex; flex-direction: column; min-width: 0; }
.rewards li .gear-ic.loot-ic { width: 34px; height: 34px; flex: none; }
.gt-name { font-size: .85rem; line-height: 1.1; }
.gt-set { font-size: .72rem; color: var(--muted); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gt-up { display: flex; flex-direction: column; align-items: center; line-height: 1.1; padding: 4px 2px; min-height: 38px; justify-content: center; }
.gt-up small { display: inline-flex; align-items: center; gap: 2px; font-size: .72rem; opacity: .9; letter-spacing: 0; }
.gt-up small img.ic { width: 12px; height: 12px; }
.gear-pop .gp-head { display: flex; gap: 10px; align-items: center; }
.gear-pop .gp-head h2 { font-size: 1.4rem; color: var(--rc); }
.modal-box.gear-pop { border-color: var(--rc); }
.gear-pop .item-stats { font-size: 1rem; background: var(--panel-2); padding: 8px 10px; border-left: 4px solid var(--rc); }
.gear-pop .gp-set { margin: 0; font-size: .92rem; color: var(--muted); }
.gear-pop .gp-set b { color: var(--fg); }
/* unlock message */
.unlock-pop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(8,6,10,.7); animation: fadein .2s ease-out; }
.unlock-card { width: min(380px, 100%); text-align: center; background: radial-gradient(circle at 50% 0, #3a2c14, var(--panel) 70%); border: 2px solid var(--gold); box-shadow: 0 0 0 4px #000, 0 0 40px -6px var(--gold); padding: 22px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: pop .3s ease-out; }
.unlock-card h2 { color: var(--gold); font-size: 1.7rem; margin: 0; }
.unlock-card p { margin: 0; color: var(--fg); }
.unlock-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); color: var(--gold); background: #1a130a; animation: glowpulse 1.4s ease-in-out infinite alternate; }
.unlock-ic svg { width: 28px; height: 28px; }
@keyframes glowpulse { from { box-shadow: 0 0 0 0 rgba(232,184,59,.5); } to { box-shadow: 0 0 18px 4px rgba(232,184,59,.35); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.inv { border: 2px solid var(--gold-dim); background: var(--bg); padding: 12px; }
.inv-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 8px; }
.inv-item { border: 2px solid var(--line); border-left: 4px solid var(--rc); background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.inv-item .owner { font-size: .8rem; color: var(--gold); }
.empty-note { color: var(--muted); font-size: .95rem; }

/* battle */
#battle { display: flex; flex-direction: column; gap: 8px; }
.b-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.b-top h2 { font-size: 1.3rem; }
#b-round { color: var(--muted); font-variant-numeric: tabular-nums; }
.order { display: flex; gap: 3px; align-items: center; overflow-x: auto; min-height: 40px; padding-block: 2px; }
.order .oc { width: 36px; height: 36px; flex: none; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; overflow: hidden; }
.order .oc img { width: 33px; height: 33px; }
.order .oc.enemy { border-color: #5a2a2a; background: #241416; }
.order .oc.now { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 2px 0 var(--gold); }
.order .oc.done { opacity: .35; }
.order .sep { width: 2px; height: 28px; background: var(--line); margin-inline: 4px; flex: none; }
.stage-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 2px solid var(--line); overflow: hidden; background: #000; user-select: none; }
#bc { position: absolute; inset: 0; width: 100%; height: 100%; } /* drawn at the screen's own resolution (app.js RS) */
#ov { position: absolute; inset: 0; pointer-events: none; }
.ou { position: absolute; transform: translate(-50%, -100%); width: 11%; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity .3s; }
.ou.dead { opacity: 0; }
/* focus (auto): a pulsing target marker over the enemy all heroes attack */
.ou.focus::before { content: ""; width: clamp(14px, 2vw, 22px); height: clamp(14px, 2vw, 22px); margin-bottom: 1px; border: 2px solid #ff5a3a; border-radius: 50%; box-shadow: 0 0 0 1px #000, 0 0 8px #ff5a3a, inset 0 0 0 2px rgba(0,0,0,.4); background: radial-gradient(circle, #ff5a3a 0 18%, transparent 22%); animation: focuspulse .9s ease-in-out infinite alternate; }
@keyframes focuspulse { from { transform: scale(.85); } to { transform: scale(1.1); } }
.can-focus .hitbox.enemy { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .ou.focus::before { animation: none; } }
.ou .onm { font-size: clamp(9px, 1.15vw, 12px); line-height: 1; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000; white-space: nowrap; }
.ou.enemy .onm { color: #f0c0b0; }
.ou.boss .onm { color: var(--ember); font-weight: 700; }
.hp { position: relative; width: 100%; height: clamp(5px, .9vw, 8px); background: #1a0e10; border: 1px solid #000; outline: 1px solid rgba(255,255,255,.08); }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); transition: width .25s; }
.hp b { position: absolute; left: 0; top: 0; bottom: 0; background: #f0e0b0; transition: width .6s .25s; }
.ou.enemy .hp i { background: var(--bad); }
.hp em { position: absolute; left: 0; top: 0; height: 45%; background: #bfe0ff; transition: width .25s; }
.fxrow { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 1px; }
.fxc { font-family: var(--font-tag); font-size: clamp(7px, .85vw, 9px); line-height: 1; padding: 1px 2px; background: #2c5a3a; color: #dff5d8; }
.fxc.bad { background: #6a2424; color: #ffd8cc; }
.fxc.arm { background: #6a4a2a; color: #ffe0b0; }
.hitbox { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; cursor: default; }
.hitbox.valid { cursor: pointer; }
.pop { position: absolute; transform: translate(-50%, 0); font-family: var(--font-display); font-weight: 700; font-size: clamp(12px, 1.8vw, 20px); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; animation: rise 1.05s ease-out forwards; white-space: nowrap; pointer-events: none; z-index: 2; }
/* damage numbers: white for a normal hit, a bigger clear red for a critical hit (no "CRIT" word: the colour says it) */
.pop.dmg { color: #ffffff; }
.pop.crit { color: #ff2e2e; font-size: clamp(16px, 2.6vw, 30px); animation-name: critrise; text-shadow: 2px 2px 0 #2a0000, -1px -1px 0 #2a0000, 1px -1px 0 #2a0000, -1px 1px 0 #2a0000, 0 0 8px rgba(255, 40, 40, .55); }
.pop.heal { color: var(--good); }
.pop.poison { color: #a8e060; }
.pop.burn { color: #ff9a4a; }
.pop.buff { color: #9fd0ff; font-size: clamp(9px, 1.2vw, 13px); }
.pop.debuff { color: #ffb09a; font-size: clamp(9px, 1.2vw, 13px); }
.pop.resist { color: #c8c0b0; font-size: clamp(9px, 1.2vw, 13px); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 30% { transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -28px); } }
@keyframes critrise { 0% { opacity: 0; transform: translate(-50%, 0) scale(2.2); } 12% { opacity: 1; transform: translate(-50%, 0) scale(.9); } 22% { transform: translate(-50%, -2px) scale(1.1); } 40% { transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px); } }
#banner { position: absolute; left: 0; right: 0; top: 38%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 16px; background: linear-gradient(90deg, transparent, rgba(10,6,12,.88) 15%, rgba(10,6,12,.88) 85%, transparent); border-block: 2px solid var(--gold); pointer-events: none; animation: bannerin .18s ease-out; z-index: 3; }
#banner.enemy { border-color: var(--bad); }
#banner .bt { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 3.6vw, 38px); color: var(--fg); text-shadow: 3px 3px 0 #000; letter-spacing: .02em; }
#banner .bs { font-family: var(--font-tag); font-size: clamp(8px, 1.1vw, 11px); color: var(--gold); letter-spacing: .1em; }
#banner.enemy .bs { color: #ff9a8a; }
#banner.big .bt { font-size: clamp(26px, 6vw, 64px); color: var(--gold); }
#banner.lose .bt { color: var(--bad); }
@keyframes bannerin { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
#flash { position: absolute; inset: 0; background: #fff6e0; opacity: 0; pointer-events: none; z-index: 2; }
#flash.go { animation: flash .22s ease-out; }
@keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
.b-bar { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: stretch; background: var(--panel); border: 2px solid var(--line); padding: 10px; }
.b-who { display: flex; gap: 8px; align-items: center; min-width: 0; }
.b-who img { flex: none; }
.b-who b { display: block; font-size: 1.1rem; }
.b-who small { color: var(--muted); display: block; line-height: 1.3; }
.b-skills { display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start; min-width: 0; }
.sk { background: var(--panel-2); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; text-align: left; min-width: 124px; display: flex; flex-direction: column; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.sk .k { font-family: var(--font-tag); font-size: 9px; color: var(--muted); }
.sk b { font-weight: 600; }
.sk small { color: var(--muted); font-size: .8rem; }
.sk.sel { border-color: var(--gold); background: #2f2618; }
.sk.sel .k { color: var(--gold); }
.sk.ready.big:not(:disabled) { border-color: #7a5ab0; }
.sk:disabled { opacity: .4; cursor: not-allowed; }
.b-desc { flex-basis: 100%; color: var(--muted); font-size: .92rem; margin: 0; }
/* coach: the tutorial in the first battle */
.coach { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: linear-gradient(120deg, #2c2213, var(--panel) 70%); border: 2px solid var(--gold); box-shadow: 0 0 0 2px #000, 0 0 18px -6px var(--gold); padding: 10px 14px; animation: pop .25s ease-out; }
.coach-body { flex: 1 1 260px; min-width: 0; }
.coach-body ol, .coach-body ul, .coach-note ul { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.coach .btn { flex: none; }
.coach-note { background: var(--panel-2); border-left: 4px solid var(--gold); padding: 8px 12px; }
.coach-pop { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 12px; background: rgba(8,6,10,.55); animation: fadein .2s ease-out; }
.coach-card { width: min(460px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(160deg, #2c2213, var(--panel) 70%); border: 2px solid var(--gold); box-shadow: 0 0 0 2px #000, 0 0 24px -6px var(--gold); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: clamp(.8rem, 2.4vw, 1rem); animation: pop .25s ease-out; }
.coach-card .btn { align-self: flex-end; }
.coach-card .coach-body { flex: none; } /* (.coach-body grows in the small tip bar; in the card it keeps its own height) */
.rb.locked { opacity: .45; }
/* battle controls: small round buttons over the top right of the battle view */
.b-ctl { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; z-index: 4; }
.rb { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding: 0; background: rgba(16,11,16,.78); border: 2px solid var(--line); color: var(--fg); cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.5); transition: border-color .15s, color .15s, transform .1s; }
.rb svg { width: 18px; height: 18px; }
.rb b { font-family: var(--font-tag); font-size: 11px; line-height: 1; }
.rb:hover { border-color: var(--gold); }
.rb:active { transform: scale(.92); }
.rb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.rb.on { border-color: var(--gold); color: var(--gold); background: rgba(47,38,24,.9); box-shadow: 0 0 10px -2px var(--gold); }
.rb.danger { color: #ff9a8a; }
.rb.danger.armed { border-color: var(--bad); background: rgba(106,36,36,.92); color: #fff; animation: armpulse .6s ease-in-out infinite alternate; }
@keyframes armpulse { from { box-shadow: 0 0 0 0 var(--bad); } to { box-shadow: 0 0 0 4px rgba(200,60,60,.35); } }
.rb.danger.armed::after { content: "Tap again to cancel the fight"; position: absolute; top: 40px; right: 0; white-space: nowrap; font-size: .75rem; background: rgba(16,11,16,.9); border: 1px solid var(--bad); padding: 2px 6px; color: #ffd8cc; }
.b-ctl .rb { position: relative; }
.btn.on { border-color: var(--gold); color: var(--gold); }
#b-log { list-style: none; margin: 0; padding: 8px 12px; background: var(--panel); border: 2px solid var(--line); max-height: 96px; overflow-y: auto; font-size: .88rem; color: var(--muted); }
#b-log li.hero { color: #cfe0f0; }
#b-log li.enemy { color: #f0c8bc; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(8,6,10,.78); display: grid; place-items: center; padding: 16px; z-index: 25; }
.modal-box { background: var(--panel); border: 2px solid var(--gold); width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 4px #000, 0 12px 40px rgba(0,0,0,.6); animation: pop .25s ease-out; }
.modal-box.wide { width: min(760px, 100%); }
.modal-box.lose { border-color: var(--bad); }
.modal-box.violet { border-color: var(--violet); }
.modal-box h2 { font-size: 2rem; color: var(--gold); }
.modal-box.lose h2 { color: var(--bad); }
.modal-box.violet h2 { color: var(--violet); }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-box.still { animation: none; } /* a popup drawn again in place (Level up after every tap) does not pop in again */
.rewards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rewards li { display: flex; align-items: center; gap: 8px; background: var(--panel-2); padding: 6px 10px; opacity: 0; animation: slidein .35s ease-out forwards; border-left: 4px solid var(--rc, var(--line)); }
.rewards li img.ic { width: 20px; height: 20px; }

/* Home: the main menu, every building as a banner under the other (menu.js MENU_ART: frame, icon and scene; the text is ours)
   (the tab bar is gone) */
#tabs { display: none !important; }
.backbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 14px; }
.home { display: flex; flex-direction: column; gap: 6px; max-width: 620px; margin: 6px auto 0; }
.hb { position: relative; display: block; width: 100%; aspect-ratio: 892 / 128; padding: 0; border: 0; background: none; color: #f6ead0; font: inherit; text-align: left; cursor: pointer; container-type: inline-size; transition: transform .15s, filter .15s, opacity .2s; }
.hb-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.hb:hover, .hb:focus-visible { transform: translateY(-1px); filter: brightness(1.12); }
.hb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hb-txt { position: absolute; left: 15.5%; right: 22%; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: .6cqw; }
.hb-name { font-family: var(--font-display); font-weight: 700; font-size: max(15px, 4.3cqw); line-height: 1.05; letter-spacing: .02em; color: #f7dfa4; text-shadow: 0 2px 2px #000, 0 0 10px rgba(0, 0, 0, .8); white-space: nowrap; }
.hb-st { display: flex; align-items: center; gap: 1cqw; font-size: max(11px, 2.75cqw); line-height: 1.2; white-space: nowrap; color: #f1e6d2; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, .9); }
.hb-st svg { width: max(10px, 2.2cqw); height: max(10px, 2.2cqw); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; }
.hb-dot { position: absolute; right: 6.6%; top: 22%; width: max(9px, 2.2cqw); aspect-ratio: 1; border-radius: 50%; background: #ff4a2a; box-shadow: 0 0 0 2px #000, 0 0 10px #ff4a2a; }
/* first steps (only the Campaign) and the tour (one building at a time): the others are dimmed */
.home.tut .hb:not(.start), .home.touring .hb:not(.tour-on) { opacity: .35; filter: grayscale(.5); }
.home.touring .hb { pointer-events: none; }
.home.touring { margin-bottom: 320px; }
.hb.start, .hb.tour-on { filter: brightness(1.15) drop-shadow(0 0 10px rgba(255, 205, 100, .85)); }
@keyframes tutbob { from { margin-top: 0; } to { margin-top: 6px; } }
@media (max-width: 760px) {
  .backbar { margin-top: 10px; }
}

/* team filters */
.tfilter { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); border: 2px solid var(--line); padding: 8px 10px; margin-bottom: 10px; }
.tf-ess { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.ess-f { min-width: 34px; height: 32px; padding: 0 6px; display: inline-grid; place-items: center; background: var(--panel-2); border: 2px solid var(--line); color: var(--muted); cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: .8rem; flex: none; }
.ess-f .aff { width: 20px; height: 20px; }
.ess-f.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.tfilter label { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); font-family: var(--font-tag); letter-spacing: .04em; text-transform: uppercase; }
.tfilter select { font: inherit; font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: .95rem; color: var(--fg); background: var(--panel-2); border: 2px solid var(--line); padding: 4px 6px; min-height: 34px; }
.tfilter select:focus { outline: none; border-color: var(--gold); }
.tf-check input { width: 18px; height: 18px; accent-color: var(--gold); }
@media (max-width: 760px) {

  .tfilter label:not(.tf-check) { flex: 1 1 30%; flex-direction: column; align-items: stretch; gap: 2px; font-size: .7rem; }
  .tfilter select { width: 100%; }
}

/* starter choice: four heroes in a dungeon hall, details below */
.st-title { text-align: center; font-size: 1.8rem; margin: 6px 0 14px; color: var(--gold); text-shadow: 0 2px 0 #000; }
.st-scene { position: relative; aspect-ratio: 16 / 9; border: 2px solid var(--line); overflow: hidden; background: #000; box-shadow: 0 0 0 2px #000, 0 12px 30px rgba(0,0,0,.5); }
.st-scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.st-scene::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, transparent 40%, rgba(0,0,0,.55)); pointer-events: none; }
.st-fig { position: absolute; top: 16%; bottom: 5%; width: 23%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: none; border: 0; padding: 0; cursor: pointer; z-index: 1; color: var(--fg); }
.st-fig img { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; object-position: 50% 100%; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)); transition: transform .2s, filter .2s; position: relative; z-index: 1; }
.st-fig .st-ring { width: 64%; height: 10px; margin-top: -7px; border-radius: 50%; background: rgba(0,0,0,.5); transition: box-shadow .2s, background .2s; }
.st-fig .st-nm { margin-top: 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(.7rem, 1.6vw, 1rem); letter-spacing: .04em; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; white-space: nowrap; }
.st-fig:hover img, .st-fig:focus-visible img { filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)) brightness(1.15); }
.st-scene.has-sel .st-fig:not(.sel) img { filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)) brightness(.5) saturate(.6); }
.st-fig.sel img { transform: translateY(-5px); filter: drop-shadow(0 0 10px rgba(217,180,90,.75)) drop-shadow(0 3px 0 rgba(0,0,0,.6)); animation: stbob 1.6s ease-in-out infinite; }
.st-fig.sel .st-ring { background: rgba(217,180,90,.35); box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(217,180,90,.8); }
.st-fig.sel .st-nm { color: var(--gold); }
@keyframes stbob { 50% { transform: translateY(-9px); } }
@media (prefers-reduced-motion: reduce) { .st-fig.sel img { animation: none; } }
.st-info { margin-top: 14px; }
.st-hint { text-align: center; margin: 18px 0; }
.st-card { background: var(--panel); border: 2px solid var(--line); border-bottom: 4px solid var(--rc); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: pop .2s ease-out; }
.st-pitch { margin: 0; color: var(--muted); }

/* a tag inside a heading must not take over the heading's text shadow (it would look written twice on the gold) */

.vt-own img.spr { width: 24px; height: 24px; border: 1px solid #000; border-radius: 50%; }
.vt-item.picked { border: 2px solid var(--gold); box-shadow: 0 0 0 1px #000, 0 0 14px -2px var(--gold); }

.vt-detail > .gear-ic { width: 64px; height: 64px; flex: none; }

/* ===== clearer tabs ===== */
/* tabs inside a screen (Social, hero details): separate folder tabs, the active one raised with a gold top edge */
.dtabs { gap: 4px; padding: 6px 6px 0; background: linear-gradient(180deg, #19141d, #120e15); border-block: 0; border-bottom: 2px solid color-mix(in srgb, var(--gold) 45%, var(--line)); box-shadow: none; }
.dtabs button {
  min-height: 46px; font-size: .98rem; color: color-mix(in srgb, var(--fg) 70%, var(--muted));
  background: linear-gradient(180deg, #221a26, #18131c); border: 1px solid color-mix(in srgb, var(--gold) 18%, var(--line)); border-bottom: 0;
  box-shadow: inset 0 1px 0 rgba(255, 240, 200, .04); transition: color .15s, background .15s;
}

}
/* ===== clearer tabs everywhere: every segmented choice, chapter and level picker, guide sections ===== */
.seg:not(.big-tabs) { border: 0; gap: 5px; flex-wrap: wrap; }
.seg:not(.big-tabs) button, .chapters button, .lvls button, .gl-nav a {
  position: relative; min-height: 40px; padding: 7px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; color: color-mix(in srgb, var(--fg) 80%, var(--muted)); text-decoration: none;
  background: linear-gradient(180deg, #2a2130, #18131c); border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--line));
  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 240, 200, .06); transition: color .15s, border-color .15s, box-shadow .15s;
}
.seg:not(.big-tabs) button:hover:not(:disabled), .chapters button:hover:not(:disabled), .lvls button:hover:not(:disabled), .gl-nav a:hover, .gl-nav a:focus-visible {
  color: var(--fg); border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); box-shadow: 0 0 0 1px #000, 0 0 12px -4px var(--gold);

.seg:not(.big-tabs) button[aria-pressed="true"], .chapters button.sel, .lvls button.sel {
  color: #1a130a; background: linear-gradient(180deg, #f3d891, var(--gold) 55%, #b48d3c); border-color: #000;
  box-shadow: 0 0 0 1px #000, 0 0 16px -3px var(--gold), inset 0 1px 0 rgba(255, 255, 255, .5);
}
.chapters button.done:not(.sel), .lvls button.done:not(.sel) { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.chapters button:disabled, .lvls button:disabled, .seg:not(.big-tabs) button:disabled { opacity: .4; box-shadow: 0 0 0 1px #000; }
.chapters button { min-width: 44px; padding: 7px 8px; }
.lvls { gap: 5px; }
.lvls button { padding: 7px 0; }
.gl-nav { gap: 6px; padding: 8px 0; }
.gl-nav a { font-size: .85rem; min-height: 36px; padding: 5px 12px; }
.g-inv-friends { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.g-inv-friends li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: linear-gradient(180deg, #211a25, #19141d); border: 1px solid color-mix(in srgb, var(--gold) 16%, var(--line)); }
.g-inv-friends img.spr { width: 30px; height: 30px; }
.ml-item.invite { border-left-color: var(--info); }
.ml-item.invite .ml-ic svg { stroke: var(--info); }
/* ===== status badges on battle units (fxBadge) ===== */
.fxrow { gap: 3px; margin-top: 2px; }
.fxi {
  --fc: #3f9a55; position: relative; display: inline-grid; place-items: center; width: clamp(16px, 1.9vw, 22px); height: clamp(16px, 1.9vw, 22px);
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--fc) 70%, #fff 10%), color-mix(in srgb, var(--fc) 55%, #000) 80%);
  border: 1px solid #000; box-shadow: 0 0 0 1px color-mix(in srgb, var(--fc) 80%, #fff 20%), 0 2px 3px rgba(0, 0, 0, .6); border-radius: 4px; color: #fff;
}
.fxi svg { width: 72%; height: 72%; fill: currentColor; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .7)); }
/* a badge can be tapped for what it does (app.js shows its text in #fx-tip), also over the battlefield */
#ov .fxi { pointer-events: auto; cursor: help; }
#fx-tip { position: fixed; z-index: 90; max-width: min(260px, calc(100vw - 16px)); padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--gold); color: var(--fg); font-size: .85rem; line-height: 1.35; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); pointer-events: none; }
.fxi.bad { --fc: #b8322a; }
.fxi.fx-burn { --fc: #e0631c; } .fxi.fx-poison, .fxi.fx-blight { --fc: #5e9e2a; } .fxi.fx-bleed { --fc: #a3122a; }
.fxi.fx-freeze { --fc: #3a8fc4; } .fxi.fx-stun, .fxi.fx-broken { --fc: #c99a1c; } .fxi.fx-shield, .fxi.fx-immune { --fc: #3c7fb8; }
.fxi.fx-ironhide, .fxi.fx-swift { --fc: #8a5a12; box-shadow: 0 0 0 1px #f0c060, 0 0 6px rgba(240, 192, 96, .7), 0 2px 3px rgba(0, 0, 0, .6); }
.fxi.rage { --fc: #c0261a; animation: ragepulse 1s ease-in-out infinite; }
.fxi.clock { --fc: #3a2f45; width: auto; padding: 0 4px; font-size: clamp(10px, 1.1vw, 13px); color: var(--gold); gap: 2px; display: inline-flex; align-items: center; }
.fxi.clock i { position: static; background: none; border: 0; color: var(--gold); font-size: inherit; padding: 0; }
.fxi.clock.soon { --fc: #8c1d12; color: #ffd9c8; animation: ragepulse 1s ease-in-out infinite; }
.fxi em { position: absolute; left: -3px; top: -5px; font-style: normal; font-size: clamp(8px, .85vw, 10px); line-height: 1; color: #fff; text-shadow: 0 0 2px #000, 0 1px 0 #000; }
.fxi.good em { color: #b9ffb0; } .fxi.bad em { color: #ffb4a8; }
.fxi i { position: absolute; right: -4px; bottom: -4px; min-width: 11px; padding: 0 2px; font-style: normal; font-family: var(--font-tag); font-weight: 700; font-size: clamp(8px, .8vw, 10px); line-height: 11px; text-align: center; color: #fff; background: #120d10; border: 1px solid color-mix(in srgb, var(--fc) 80%, #fff 10%); border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { .fxi.rage, .fxi.clock.soon { animation: none; } }

.card.missing { opacity: .78; }

/* ===== ornate UI pass: gilded buttons, hero cards with rarity frames and essence-tinted art, decorated headings ===== */
/* buttons: dark steel with a gold inner line; primary gilded gold, violet arcane, danger blood-red */
.btn { position: relative; border-radius: 3px; border: 1px solid #5c4a35; color: #ecdcbd; text-shadow: 0 1px 0 #000;
  background: linear-gradient(180deg, #3b3040 0%, #261e2b 52%, #1b151f 100%);
  box-shadow: inset 0 1px 0 rgba(255, 236, 190, .16), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 0 0 1px #090609, 0 3px 6px -2px rgba(0, 0, 0, .7);

.btn:hover:not(:disabled) { border-color: var(--gold); color: #fff4da; box-shadow: inset 0 1px 0 rgba(255, 236, 190, .22), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 0 0 1px #090609, 0 0 14px -2px rgba(217, 180, 90, .55); }

  box-shadow: inset 0 1px 0 rgba(255, 252, 230, .85), inset 0 -2px 0 rgba(80, 45, 8, .55), 0 0 0 1px #1a0f04, 0 3px 8px -2px rgba(0, 0, 0, .7), 0 0 14px -4px rgba(240, 180, 70, .6); }
.btn.primary::before { border-color: rgba(255, 246, 214, .5); }
.btn.primary:hover:not(:disabled) { color: #2b1905; background: linear-gradient(180deg, #fff0bf 0%, #eec263 40%, #c78d38 78%, #a06c22 100%);
  box-shadow: inset 0 1px 0 rgba(255, 252, 230, .9), inset 0 -2px 0 rgba(80, 45, 8, .55), 0 0 0 1px #1a0f04, 0 0 18px -2px rgba(250, 200, 90, .8); }
.btn.violet { color: #f6efff; border-color: #2a1a52; background: linear-gradient(180deg, #9a76ec 0%, #6a46b8 45%, #46297e 100%);
  box-shadow: inset 0 1px 0 rgba(235, 220, 255, .55), inset 0 -2px 0 rgba(30, 10, 60, .5), 0 0 0 1px #0d0718, 0 3px 8px -2px rgba(0, 0, 0, .7), 0 0 14px -4px rgba(176, 138, 255, .6); }
.btn.violet::before { border-color: rgba(230, 215, 255, .35); }
.btn.violet:hover:not(:disabled) { background: linear-gradient(180deg, #ab8af5 0%, #7a54cc 45%, #52308f 100%); color: #fff; }
.btn.danger { color: #ffd2c6; border-color: #5a1a14; background: linear-gradient(180deg, #7a2a22 0%, #4e1813 55%, #331009 100%); }

/* headings: an ornament line with a gem under the screen title */
#screen .section-head h2 { position: relative; padding-bottom: 10px; background: linear-gradient(180deg, #fff1cc, #e2b85e 60%, #b8853a); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
#screen .section-head h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: min(260px, 100%); height: 9px;
  background: linear-gradient(45deg, transparent 38%, var(--gold) 38% 62%, transparent 62%) 50% 50% / 9px 9px no-repeat, linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent) 50% 50% / 100% 1px no-repeat;
  filter: drop-shadow(0 0 4px rgba(217, 180, 90, .55)); }

/* hero cards and team slots: rarity-coloured double frame, the essence's glow behind the art, a gem for the level */
.slot.filled, .grid-cards .card { border: 0; border-radius: 6px; padding: 6px 6px 9px; overflow: hidden;
  background: radial-gradient(85% 50% at 50% 32%, color-mix(in srgb, var(--ec, #8a7a9a) 34%, transparent), transparent 72%), linear-gradient(180deg, #2b2231 0%, #17121b 100%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rc) 70%, #000), inset 0 0 0 3px #0d0a10, inset 0 0 0 4px color-mix(in srgb, var(--rc) 35%, transparent), 0 0 0 1px #000, 0 6px 14px -6px rgba(0, 0, 0, .85);
  transition: transform .12s, box-shadow .15s; }
.slot.filled::after, .grid-cards .card::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--rc) 20%, color-mix(in srgb, var(--rc) 50%, #fff) 50%, var(--rc) 80%, transparent); box-shadow: 0 0 10px var(--rc); }
.slot.filled:hover, .grid-cards .card:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--rc), inset 0 0 0 3px #0d0a10, inset 0 0 0 4px color-mix(in srgb, var(--rc) 55%, transparent), 0 0 0 1px #000, 0 0 18px -4px var(--rc); }
.slot.filled.sel, .grid-cards .card.sel { outline: 0; box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px #0d0a10, inset 0 0 0 5px color-mix(in srgb, var(--gold) 50%, transparent), 0 0 0 1px #000, 0 0 20px -3px var(--gold); }
.slot.filled img.spr, .grid-cards .card img.spr { border-radius: 4px; box-shadow: 0 0 0 1px #000, 0 0 0 2px color-mix(in srgb, var(--rc) 60%, #000), 0 4px 10px -2px rgba(0, 0, 0, .7); }
.slot:not(.filled) { border: 2px dashed color-mix(in srgb, var(--gold) 30%, var(--line)); border-radius: 6px; background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .02) 0 8px, transparent 8px 16px), #15111a; }
.slot.filled b { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .03em; color: #f6ead0; text-shadow: 0 1px 0 #000, 0 0 10px color-mix(in srgb, var(--ec, #fff) 40%, transparent); }
.card .lv, .slot .lv { min-width: 24px; height: 24px; padding: 0 4px; border: 0; color: #2b1905; font-family: var(--font-tag); font-weight: 900; font-size: 11px;
  background: linear-gradient(180deg, #fbe4a0, #d9a944 60%, #a8742a); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); filter: drop-shadow(0 1px 1px #000); }
.card .aff, .slot .aff { box-shadow: 0 0 0 1px #000, 0 0 8px color-mix(in srgb, var(--c) 70%, transparent); border-radius: 4px; }
.stars { color: #ffd36b; text-shadow: 0 0 6px rgba(255, 196, 70, .55), 0 1px 0 #000; }
.card.inteam::after { background: linear-gradient(180deg, #fbe4a0, #d9a944 55%, #a8742a); color: #2b1905; padding: 1px 8px; border-radius: 2px;
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%); box-shadow: none; }

/* role checklist: each role its own colour and icon */
.roles-chk li { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 3px; font-family: var(--font-tag); font-size: .66rem; letter-spacing: .03em; text-transform: uppercase;
  --rl: var(--good); border: 1px solid color-mix(in srgb, var(--rl) 55%, #000); background: linear-gradient(180deg, color-mix(in srgb, var(--rl) 22%, #1b151f), #151018); color: color-mix(in srgb, var(--rl) 70%, #fff); }
.roles-chk li i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-style: normal; font-size: 10px; color: #120d10; background: var(--rl); box-shadow: 0 0 8px color-mix(in srgb, var(--rl) 70%, transparent); }

.roles-chk li.miss i { background: #3a3340; color: #8a8090; box-shadow: none; outline: 1px dashed #8a8090; outline-offset: 1px; }
.roles-chk li.miss small { font-size: .6rem; color: #e88a6a; text-transform: none; letter-spacing: 0; font-family: var(--font-body); }

/* the hero details: the hero stands in the glow of its essence */
.detail .d-head { position: relative; padding: 12px; margin: -16px -16px 14px; border-bottom: 1px solid color-mix(in srgb, var(--gold) 25%, var(--line));
  background: radial-gradient(60% 120% at 12% 60%, color-mix(in srgb, var(--ec, #8a7a9a) 38%, transparent), transparent 70%), linear-gradient(90deg, rgba(255, 255, 255, .03), transparent); }
.detail .d-head .bigspr { background: radial-gradient(circle at 50% 75%, color-mix(in srgb, var(--ec, #8a7a9a) 45%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--rc) 60%, #000); box-shadow: 0 0 0 1px #000, 0 0 18px -4px var(--rc); border-radius: 6px; }
.detail .d-head h2 { color: #fff1cc; text-shadow: 0 0 14px color-mix(in srgb, var(--ec, #fff) 55%, transparent), 0 2px 0 #000; }
.dtabs button[aria-selected="true"] { color: #fff1cc; background: linear-gradient(180deg, rgba(217, 180, 90, .22), rgba(217, 180, 90, .05)); box-shadow: inset 0 -3px 0 var(--gold), inset 0 0 0 1px rgba(217, 180, 90, .25); }

/* team tabs and the filter bar get the framed-panel look */
.tm-tab, .tfilter {
  --corner: color-mix(in srgb, var(--gold) 75%, transparent);
  --frame: linear-gradient(var(--corner), var(--corner)) 0 0 / 10px 2px no-repeat, linear-gradient(var(--corner), var(--corner)) 0 0 / 2px 10px no-repeat,
    linear-gradient(var(--corner), var(--corner)) 100% 100% / 10px 2px no-repeat, linear-gradient(var(--corner), var(--corner)) 100% 100% / 2px 10px no-repeat;
  background: var(--frame), linear-gradient(180deg, #261e2b, #17121b); border: 1px solid color-mix(in srgb, var(--gold) 22%, var(--line)); box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 240, 200, .05); }
.tm-tab { border-radius: 4px; }

.tm-tab.on b { color: #fff1cc; }

.tm-mode { border-radius: 999px; background: linear-gradient(180deg, #241c29, #17121b); box-shadow: 0 0 0 1px #000; }
.tm-mode.on { color: #2b1905; border-color: #6e4a18; background: linear-gradient(180deg, #fbe4a0, #d9a944 60%, #a8742a); text-shadow: 0 1px 0 rgba(255, 238, 190, .6); }
.power b { background: linear-gradient(180deg, #fff1cc, #e2b85e 60%, #b8853a); -webkit-background-clip: text; background-clip: text; color: transparent; }
@media (max-width: 560px) { .slot.filled b { font-size: clamp(.68rem, 3.1vw, .95rem); letter-spacing: 0; overflow-wrap: normal; word-break: keep-all; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; } }
.fr-fc { font-family: var(--font-body); font-weight: 400; font-size: .78rem; letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.lockmark { position: absolute; left: 6px; bottom: 30px; z-index: 2; font-size: 12px; filter: drop-shadow(0 1px 1px #000); }
.lock-btn.on { border-color: var(--gold); color: var(--gold); }
.tw-warn { margin: 4px 0 8px; padding: 6px 10px; border-left: 3px solid var(--bad); background: rgba(217, 83, 63, .12); color: #ffc2b4; font-size: .92rem; }
/* ===== phones (portrait, or landscape with a short screen): slim header with a Home button and a ☰ menu ===== */
.homebtn, #menubtn, .mmenu { display: none; }
@media (max-width: 760px), (max-height: 500px) and (orientation: landscape) {
  .top { position: sticky; top: 0; z-index: 20; flex-wrap: nowrap; gap: 6px; margin-inline: -12px; padding: calc(5px + env(safe-area-inset-top, 0px)) 10px 5px;
    background: linear-gradient(180deg, #1d1720, #120e15); border-bottom: 1px solid #3a2e24; box-shadow: 0 4px 12px rgba(0, 0, 0, .45); }
  body:not([data-tab="home"]) .top .brand { display: none; }

    font: 700 13px/1 var(--font-tag); letter-spacing: .03em; color: #2b1905; border: 1px solid #1a0f04;
    background: linear-gradient(180deg, #fbe4a0, #e2b452 45%, #b78130); box-shadow: inset 0 1px 0 rgba(255, 252, 230, .85), 0 0 0 1px #d9b45a, 0 0 10px rgba(240, 180, 70, .45); }

  .wallet .res:has(#ic-shard), .wallet .res:has(#ic-stone), #sound, #guide, #mail { display: none !important; }

    max-height: calc(100dvh - 60px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #9c7c37 transparent; }
  .mm-box { display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 12px; border: 1px solid #6e5528;

/* ===== phones: the battle is one full-height screen (no scrolling); the log takes whatever height is left ===== */

}
@media (max-width: 760px), (max-height: 500px) and (orientation: landscape) { #app:has(#battle:not([hidden])) { padding-top: 0; padding-bottom: 0; } #battle:not([hidden]) { box-sizing: border-box; } }
