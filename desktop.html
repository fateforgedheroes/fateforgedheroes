<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fate Forged Heroes</title>
<meta name="description" content="Fate Forged Heroes: a turn-based fantasy RPG. Summon heroes at the Fate Altar, forge your team and fight through ten chapters and a hall of bosses.">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap">
<style>
  /* On a computer the game plays inside a phone held on its side: the page (index.html, ?inapp=1) runs in an iframe of
     exactly a phone's screen (844 x 390 CSS pixels, an iPhone on its side), so every phone layout applies as on a real
     phone; the phone is zoomed to fit the window (CSS zoom keeps it sharp). */
  :root { --w: 844px; --h: 390px; --bz: 16px; --in: 10px; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; overflow: hidden; font-family: Cinzel, Georgia, serif; color: #d9ccb6;
    background: radial-gradient(ellipse at 50% 40%, rgba(40, 28, 52, .55), rgba(6, 4, 9, .96) 70%), url(/backgrounds/ch10.webp) center / cover no-repeat, #0b0810; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone { position: relative; box-sizing: content-box; width: calc(var(--w) + 2 * var(--in)); height: calc(var(--h) + 2 * var(--in)); padding: var(--bz); border-radius: 46px;
    background: linear-gradient(145deg, #2b2a30, #0d0d10 45%, #1b1a1f); box-shadow: 0 0 0 2px #3a3940, 0 0 0 5px #0a0a0c, 0 30px 80px rgba(0, 0, 0, .75), 0 0 60px rgba(217, 180, 90, .12); }
  .phone::before { /* the camera, at the left edge of a phone on its side */ content: ""; position: absolute; left: 6px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3b4a6b, #050507 60%); box-shadow: 0 0 0 2px #151519; }
  .btn-a, .btn-b, .btn-c { position: absolute; background: linear-gradient(180deg, #3a3940, #1d1c21); border-radius: 3px; }
  .btn-a { top: -6px; left: 150px; width: 56px; height: 4px; } .btn-b { top: -6px; left: 220px; width: 56px; height: 4px; } .btn-c { bottom: -6px; left: 190px; width: 80px; height: 4px; }
  /* the display: rounded like a phone's, with a thin black edge inside it (--in) so the game's square corners (the turn
     order, the round buttons, the skill column) are never cut off by the rounding; the game itself stays 844 x 390 */
  .screen { position: relative; box-sizing: border-box; width: calc(var(--w) + 2 * var(--in)); height: calc(var(--h) + 2 * var(--in)); padding: var(--in); border-radius: 30px; overflow: hidden; background: #000; }
  iframe { display: block; width: var(--w); height: var(--h); border: 0; border-radius: 6px; background: #110e13; }
  .under { display: flex; gap: 16px; align-items: center; font-size: 13px; letter-spacing: .06em; opacity: .75; }
  .under a { color: #d9b45a; text-decoration: none; } .under a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone"><i class="btn-a"></i><i class="btn-b"></i><i class="btn-c"></i>
    <div class="screen"><iframe id="game" title="Fate Forged Heroes" allow="autoplay; fullscreen; clipboard-write"></iframe></div>
  </div>
  <div class="under"><span>Made for phones: play it on yours too</span></div>
</div>
<script>
  // the game in the phone; sign-in links (email confirmation, Google) arrive here with their tokens in the hash, which
  // goes to the game and is taken out of the address bar
  const game = document.getElementById('game'), phone = document.getElementById('phone');
  const q = new URLSearchParams(location.search); q.set('inapp', '1');
  game.src = '/?' + q.toString() + location.hash;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  // the phone grows or shrinks with the window (zoom keeps the game sharp, unlike a transform)
  function fit() {
    const w = 844 + 2 * 10 + 2 * 16 + 20, h = 390 + 2 * 10 + 2 * 16 + 60;
    const s = Math.max(0.5, Math.min((innerWidth - 40) / w, (innerHeight - 40) / h, 2.2));
    phone.style.zoom = s; document.querySelector('.under').style.zoom = Math.min(1.4, Math.max(0.8, s));
  }
  addEventListener('resize', fit); fit();
  game.addEventListener('load', () => game.focus());
  document.addEventListener('click', e => { if (!e.target.closest('a')) game.focus(); });
</script>
</body>
</html>
